get_plan:
  fields:
    user_id:
      required: false
      selector:
        text:
get_workouts:
  fields:
    user_id:
      required: false
      selector:
        text:
    days:
      required: false
      default: 30
      selector:
        number:
          min: 1
          max: 3650
    limit:
      required: false
      default: 50
      selector:
        number:
          min: 1
          max: 500
export:
  fields:
    user_id:
      required: false
      selector:
        text:
import:
  fields:
    user_id:
      required: false
      selector:
        text:
    csv:
      required: true
      selector:
        text:
          multiline: true
    dry_run:
      required: false
      default: true
      selector:
        boolean:
suggest_program:
  fields:
    user_id:
      required: false
      selector:
        text:
    days:
      required: true
      selector:
        number:
          min: 1
          max: 6
