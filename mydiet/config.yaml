name: MyDietAssistant
version: "1.5.0"
slug: mydiet
url: https://github.com/Schumey/MyDietAssistant
description: Lokales Ernährungstagebuch (Kalorien & Makros) mit HA-Sensoren
arch: [amd64, aarch64]
init: false
ingress: true
panel_icon: mdi:food-apple
panel_title: Ernährung
homeassistant_api: true
options:
  default_kcal_goal: 2000
  publish_sensors: true
  auto_backup: true
  backup_keep_days: 14
  api_key: ""
  usda_api_key: ""
  admin_users: []
  mqtt_discovery: false
schema:
  default_kcal_goal: int(500,10000)
  publish_sensors: bool
  auto_backup: bool
  backup_keep_days: int(1,365)
  api_key: str?
  usda_api_key: str?
  admin_users:
    - str
  mqtt_discovery: bool
map:
  - type: data
    read_only: false
  - type: backup
    read_only: false
