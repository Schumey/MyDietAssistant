<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MyDietAssistant</title>
<link rel="stylesheet" href="static/style.css">
</head>
<body>
<header class="appbar">
  <h1>Ernährung</h1>
  <nav id="tabs">
    <button data-tab="diary" class="active">Tagebuch</button>
    <button data-tab="foods">Lebensmittel</button>
    <button data-tab="weight">Gewicht</button>
    <button data-tab="stats">Statistik</button>
    <button data-tab="settings">Einstellungen</button>
  </nav>
  <span id="who" class="muted"></span>
</header>

<main>
  <section id="diary"></section>
  <section id="foods" hidden></section>
  <section id="weight" hidden></section>
  <section id="stats" hidden></section>
  <section id="settings" hidden></section>
</main>

<dialog id="dlg"></dialog>
<script src="static/theme.js"></script>
<script src="static/app.js"></script>
</body>
</html>
