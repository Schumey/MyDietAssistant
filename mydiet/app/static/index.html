<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MyDietAssistant</title>
<link rel="stylesheet" href="static/style.css">
</head>
<body>
<div id="win">
<header class="appbar">
  <h1>Ernährung</h1>
  <nav id="tabs" role="tablist" aria-label="Hauptmenü">
    <button data-tab="diary" class="active" role="tab" aria-selected="true">Tagebuch</button>
    <button data-tab="foods" role="tab" aria-selected="false" tabindex="-1">Lebensmittel</button>
    <button data-tab="meals" role="tab" aria-selected="false" tabindex="-1">Mahlzeiten</button>
    <button data-tab="recipes" role="tab" aria-selected="false" tabindex="-1" hidden>Rezepte</button>
    <button data-tab="weight" role="tab" aria-selected="false" tabindex="-1">Gewicht</button>
    <button data-tab="stats" role="tab" aria-selected="false" tabindex="-1">Statistik</button>
    <button data-tab="settings" role="tab" aria-selected="false" tabindex="-1">Einstellungen</button>
  </nav>
  <span id="who" class="muted"></span>
</header>

<main>
  <section id="diary" role="tabpanel"></section>
  <section id="foods" role="tabpanel" hidden></section>
  <section id="meals" role="tabpanel" hidden></section>
  <section id="recipes" role="tabpanel" hidden></section>
  <section id="weight" role="tabpanel" hidden></section>
  <section id="stats" role="tabpanel" hidden></section>
  <section id="settings" role="tabpanel" hidden></section>
</main>
</div>

<dialog id="dlg"></dialog>
<script src="static/theme.js"></script>
<script src="static/app.js"></script>
</body>
</html>
