configuration:
  default_kcal_goal:
    name: Default calorie goal
    description: Daily calorie goal for new users (changeable per user in the settings).
  publish_sensors:
    name: Publish sensors
    description: Send today's totals and the latest weight to Home Assistant as sensors.
  auto_backup:
    name: Automatic backup
    description: Write a daily JSON backup of every user to /backup/mydiet.
  backup_keep_days:
    name: Keep backups (days)
    description: Older automatic backups are deleted.
  admin_users:
    name: Administrators
    description: User IDs or names that may open the user administration. Empty = the first user who opened the add-on.
  usda_api_key:
    name: USDA API key
    description: Optional key from api.data.gov for the USDA data source (without a key the shared DEMO_KEY with a low request limit is used).
  api_key:
    name: API key
    description: Key for the external interface (header X-MDA-Key). Empty = interface off.
  mqtt_discovery:
    name: MQTT discovery
    description: Create sensors via MQTT discovery (unique IDs, kept after an HA restart). Needs the MQTT integration; without it plain states are sent.
