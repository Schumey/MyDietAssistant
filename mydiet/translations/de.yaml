configuration:
  default_kcal_goal:
    name: Standard-Kalorienziel
    description: Tagesziel für neue Benutzer (pro Benutzer in den Einstellungen änderbar).
  publish_sensors:
    name: Sensoren veröffentlichen
    description: Tagessummen und letztes Gewicht als Sensoren an Home Assistant senden.
  auto_backup:
    name: Automatische Sicherung
    description: Täglich eine JSON-Sicherung jedes Benutzers nach /backup/mydiet schreiben.
  backup_keep_days:
    name: Sicherungen aufbewahren (Tage)
    description: Ältere automatische Sicherungen werden gelöscht.
  admin_users:
    name: Administratoren
    description: Benutzer-IDs oder Namen, die die Benutzerverwaltung öffnen dürfen. Leer = der erste Benutzer, der das Add-on geöffnet hat.
  usda_api_key:
    name: USDA-API-Schlüssel
    description: Optionaler Schlüssel von api.data.gov für die Datenquelle USDA (ohne Schlüssel gilt der gemeinsame DEMO_KEY mit niedrigem Limit).
  api_key:
    name: API-Schlüssel
    description: Schlüssel für die externe Schnittstelle (Header X-MDA-Key). Leer = Schnittstelle aus.
  mqtt_discovery:
    name: MQTT Discovery
    description: Sensoren per MQTT Discovery anlegen (eindeutige IDs, bleiben nach einem HA-Neustart erhalten). Braucht die MQTT-Integration; ohne sie werden normale Zustände gesendet.
