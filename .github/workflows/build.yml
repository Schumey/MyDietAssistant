name: Build images

# Builds the add-on container for both architectures and publishes it to the GitHub Container Registry
# (ghcr.io/<owner>/mydiet-<arch>:<version>). Runs for version tags (v1.1.0) or by hand.
# Home Assistant only pulls these once `image:` is set in mydiet/config.yaml (see README, "Fertige Images").

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Read version and image name
        id: meta
        run: |
          version=$(grep -m1 '^version:' mydiet/config.yaml | sed 's/version: *//; s/"//g')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v$version" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match version $version in config.yaml" >&2
            exit 1
          fi
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: mydiet
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/mydiet-${{ matrix.arch }}:${{ steps.meta.outputs.version }}
            ghcr.io/${{ steps.meta.outputs.owner }}/mydiet-${{ matrix.arch }}:latest
