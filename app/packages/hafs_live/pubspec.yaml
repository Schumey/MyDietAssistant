name: hafs_live
description: "Permanent workout notification of HAFS with its own layout (weight, reps, set done) on Android."
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.13.7
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: de.schumey.hafs_live
        pluginClass: HafsLivePlugin
